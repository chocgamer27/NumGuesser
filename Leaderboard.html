<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const supabaseUrl = "https://bxjhtqfioywimtpmqtmz.supabase.co";
    const supabaseKey = "sb_publishable_sOPi3rbIzvOzhBiRDYH0gQ_cy7V24eh";

    const db = window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );

    async function getdata() {
        const { data, error } = await db
            .from("Scores")
            .select("*")
            .order("score", { ascending: true})

        if (error){
            console.error(error);
            return;
        }

        let buffer = 0

        for (let i=0; data.length>i; i++){
            if (i != 0){
                if (data[i].score !== data[i-1].score){
                   NewElement = document.createElement("h2")
                    NewElement.textContent = `${i+1-buffer}. ${data[i].name} - ${data[i].score} guesses!`;
                    NewElement.style = `position: absolute;
                    left: auto; 
                    top: ${i*9}%; 
                    background-color: 
                    rgb(18, 16, 158); 
                    color: rgb(240, 174, 211); 
                    width: 98.5%; 
                    height: 7%; 
                    font-family: cursive; 
                    align-content: center; 
                    text-align: center; 
                    border-radius: 30px; 
                    font-size: 200%;`;
                    document.body.appendChild(NewElement);
                } else {
                    buffer = buffer + 1
                    NewElement = document.createElement("h2")
                    NewElement.textContent = `${i+1-buffer}. ${data[i].name} - ${data[i].score} guesses!`;
                    NewElement.style = `position: absolute;
                    left: auto; 
                    top: ${i*9}%; 
                    background-color: 
                    rgb(18, 16, 158); 
                    color: rgb(240, 174, 211); 
                    width: 98.5%; 
                    height: 7%; 
                    font-family: cursive; 
                    align-content: center; 
                    text-align: center; 
                    border-radius: 30px; 
                    font-size: 200%;`;
                    document.body.appendChild(NewElement);
                }
            } else {
                NewElement = document.createElement("h2")
                NewElement.textContent = `${i+1-buffer}. ${data[i].name} - ${data[i].score} guesses!`;
                NewElement.style = `position: absolute;
                left: auto; 
                top: ${i*9}%; 
                background-color: 
                rgb(18, 16, 158); 
                color: rgb(240, 174, 211); 
                width: 98.5%; 
                height: 7%; 
                font-family: cursive; 
                align-content: center; 
                text-align: center; 
                border-radius: 30px; 
                font-size: 200%;`;
                document.body.appendChild(NewElement);
            }
            
        }
        if (data.length == 0){
            NewElement = document.createElement("h2")
            NewElement.textContent = `Looks like the leaderboard is quite empty, hmm. Maybe you could be #1?`;
            NewElement.style = `position: absolute;
            left: auto; 
            top: ${i*9}%; 
            background-color: 
            rgb(18, 16, 158); 
            color: rgb(240, 174, 211); 
            width: 98.5%; 
            height: 7%; 
            font-family: cursive; 
            align-content: center; 
            text-align: center; 
            border-radius: 30px; 
            font-size: 200%;`;
            document.body.appendChild(NewElement);
        }
    }


    getdata();

</script>
