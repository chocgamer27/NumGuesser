<body>

    <button id="Startbutton"; 
    onclick=" start()"; 
    style="position: absolute;
    width: 15%; 
    height: 15%;
    font-size: xx-large;"></button>
    <h1 id="DebugNum" style="position:absolute; font-size: xx-large; position: absolute; width: 15%; height: 15%; top: 30%;"></h1>
    <textarea id="guessinput" style="position:absolute; font-family: cursive;font-size: xx-large;height: 30%; width: 30%; top: 10%; right: 0%;""></textarea>

</body>

<script>
    let num = 0;
    let running = 0
    document.getElementById("StartButton").textContent = "Click to start!"
    function start(){
        
        if (!running){
            running = 1
            function rand(){
                num = Math.floor(Math.random(1)*10000)
            };
            rand();
            document.getElementById("DebugNum").textContent = num;
            document.getElementById("StartButton").value = "Submit Guess!"
        }
        else guess()


    }
    function guess(){
        guessval = Number(document.getElementById("guessinput").value);

        if (guessval>num){
            console.log("too high")
        };
        if (guessval<num){
            console.log("too low")
        };
        if (guessval==num){
            console.log("winna")
            document.getElementById("StartButton").textContent = "Click to start again!"
            running = 0
            rand();
        };
    }
        
</script>
