<body>

    <button id="StartButton"; 
    onclick=" start()"; 
    style="position: absolute;
    width: 30%; 
    height: 15%;
    top: 46%;
    left: 35%;
    font-size: xx-large;
    border-radius: 100px;
    font-family: cursive;">Click to start!</button>
    <h1 id="DebugNum" style="position:absolute; font-size: xx-large; position: absolute; width: 15%; height: 15%; top: 30%;"></h1>
    <textarea id="GuessInput" style="position:absolute;
    font-family: cursive;
    font-size: 700%;
    align-content: center;
    height: 35%;
    width: 80%;
    top: 10%;
    right: 10%;
    resize: none;
    border: 0;
    scrollbar-width: none;
    word-break: keep-all;
    background-color: darkcyan;
    border-radius: 100px;"; 
    placeholder="Enter Number";
    hidden="true"></textarea>

</body>

<script>
    let num = 0;
    let running = 0

    function rand(){
        num = Math.floor(Math.random(1)*10000)
    };

    function start(){
        
        if (!running){
            running = 1
            rand();
            document.getElementById("DebugNum").textContent = num;
            document.getElementById("StartButton").textContent = "Submit Guess!"
            document.getElementById("GuessInput").style
        }
        else guess()


    }
    function guess(){
        guessval = Number(document.getElementById("GuessInput").value);

        if (guessval>num){
            console.log("too high")
        };
        if (guessval<num){
            console.log("too low")
        };
        if (guessval==num){
            console.log("winna")
            document.getElementById("StartButton").textContent = "Click to start again!"
            document.getElementById("GuessInput").hidden=true
            running = 0
        };
    }
        
</script>
