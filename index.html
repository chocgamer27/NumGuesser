<body style="background-color: rgb(7, 50, 77);">

    <header style="position: absolute; top: 1%; background-color: rgb(30, 29, 79); color: rgb(243, 177, 214); width: 98.5%; height: 7.5%; font-family: cursive; align-content: center; text-align: center; border-radius: 30px; font-size: 300%;">Guess a number between 0 and 1,000,000</header>

    <button id="StartButton"; 
    onclick=" start()"; 
    style="position: absolute;
    width: 30%; 
    height: 15%;
    top: 46%;
    left: 35%;
    font-size: xx-large;
    border-radius: 100px;
    font-family: cursive;">Click to start!</button>
    
    <h1 id="DebugNum" style="position:absolute; font-size: 100%; position: absolute; width: 15%; height: 15%; bottom: 23%; color: darkgrey;"; hidden="true"></h1>
    
    <h1 id="GuessesNum" style="position:absolute; font-size: 100%; position: absolute; width: 15%; height: 15%; bottom: 19%; color: darkgrey;"; hidden="true"></h1>
    
    <h1 id="TotalGuessesNum" style="position:absolute; font-size: 100%; position: absolute; width: 15%; height: 15%; bottom: 15%; color: darkgrey;"; hidden="true"></h1>
    
    <h1 id="WinsNum" style="position:absolute; font-size: 100%; position: absolute; width: 15%; height: 15%; bottom: 11%; color: darkgrey;"; hidden="true"></h1>
    
    <h1 id="AverageNum" style="position:absolute; font-size: 100%; position: absolute; width: 15%; height: 15%; bottom: 7%; color: darkgrey;"; hidden="true"></h1>
    
    <h1 id="Best" style="position:absolute; font-size: 100%; position: absolute; width: 15%; height: 15%; bottom: 3%; color: darkgrey;"; hidden="true"></h1>
    
    <a href="Leaderboard.html" style="position: absolute; bottom: 2%; left: 12%; width: 15%; height: 10%; font-size: 200%; color: rgb(240, 174, 211); background-color: rgba(134, 79, 185, 0.6); border-radius: 10px; align-content: center; text-align: center;">Go to Leaderboard!</a>

    <textarea id="GuessInput" style="position:absolute;
    font-family: cursive;
    font-size: 700%;
    align-content: center;
    text-align: center;
    height: 35%;
    width: 80%;
    top: 10%;
    right: 10%;
    resize: none;
    border: 0;
    scrollbar-width: none;
    word-break: keep-all;
    color: darkgrey;
    background-color: rgb(0, 31, 31);
    border-radius: 100px;";
    placeholder="Enter Number";
    hidden="true"></textarea>
    <h1 id="Status"
    style="
    position: absolute;
    top: 60%;
    width: 98%;
    align-content: center;
    text-align: center;
    font-size: 450%;
    color: rgb(243, 177, 214);
    "></h1>


    <button id="ShowAns"; style="position:absolute; color: darkgrey; font-size: x-large; position: absolute; width: 8%; height: 12%; bottom: 1%; background-color: rgb(45, 90, 91); border-radius: 20px;" onclick=" Ans()">Random Stats</button>

    <textarea id="EnterName" style="position: absolute; left: 30%; top: 88%; background-color: rgb(30, 29, 79); color: rgb(243, 177, 214); width: 25%; height: 11%; font-family: cursive; align-content: center; text-align: center; border-radius: 30px; font-size: 200%; resize: none;"; placeholder="Enter A Name"></textarea>
    <button id="SubmitName" style="position: absolute; left: 60%; top: 88%; background-color: rgb(67, 65, 178); color: rgb(203, 139, 175); width: 10%; height: 11%; font-family: cursive; align-content: center; text-align: center; border-radius: 30px; font-size: 200%; resize: none;" onclick=" EnterName()">Submit Name</button>

</body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const supabaseUrl = "https://bxjhtqfioywimtpmqtmz.supabase.co";
    const supabaseKey = "sb_publishable_sOPi3rbIzvOzhBiRDYH0gQ_cy7V24eh";

    const db = window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );

    async function DelScore(id) {
        const { data, error } = await db
            .from("Scores")
            .delete()
            .eq("id", id);

        if (error) {
            console.error(error)
            return;
        }
    }

    async function Checkdata(checkname, checkbest) {
        const { data, error } = await db
            .from("Scores")
            .select("*")
            .order("score", { ascending: true})

        if (error){
            console.error(error);
            return;
        }

        let found = false;
        let i = 0

        for (i=0; data.length>i; i++){
            if (data[i].name == checkname){
                found = true;
                if (data[i].score > checkbest){
                    await DelScore(data[i].id);
                    await SubmitScore(checkname, checkbest);
                    document.getElementById("Status").textContent = `Nice work ${checkname}! Your score of ${checkbest} has been put on the leaderboard at position ${i +1}!!`
                } else {
                    document.getElementById("Status").textContent = "Sorry but its not better then your best of " + data[i].score;
                }
            }
        };
        if (found == false){
            SubmitScore(checkname, checkbest);
            document.getElementById("Status").textContent = `Nice work ${checkname}! Your score of ${checkbest} has been put on the leaderboard at position ${i +1}!!`;
        }
        
    }

    async function SubmitScore(name, score) {
        const { data, error } = await db
            .from("Scores")
            .insert({
                name: name,
                score: score
            });
        if (error) {
            console.error(error)
            return;
        }
    }

    let lamba = 0;
    let running = 0
    let wins = 0
    let totalguesses = 0
    let guesses = 0
    let best = 1000000
    let UserName = ""

    function EnterName(){
        UserName = document.getElementById("EnterName").value
        if (!UserName == ""){
            document.getElementById("Status").textContent = "Hi " + UserName +"!!"
            document.getElementById("SubmitName").hidden = true
            document.getElementById("EnterName").hidden = true
        } else{
            document.getElementById("Status").textContent = "Username Invalid!!"
        }

    }

    function Ans(){
        if (document.getElementById("GuessesNum").hidden == false){
            //document.getElementById("DebugNum").hidden = true;
            document.getElementById("GuessesNum").hidden = true;
            document.getElementById("TotalGuessesNum").hidden = true;
            document.getElementById("WinsNum").hidden = true;
            document.getElementById("AverageNum").hidden = true;
            document.getElementById("Best").hidden = true;
        }
        else {
            //document.getElementById("DebugNum").hidden = false;
            document.getElementById("GuessesNum").hidden = false;
            document.getElementById("TotalGuessesNum").hidden = false;
            document.getElementById("WinsNum").hidden = false;
            document.getElementById("AverageNum").hidden = false;
            document.getElementById("Best").hidden = false;
        };
        if (document.getElementById("DebugNum").textContent == ""){
            document.getElementById("DebugNum").textContent = "Try starting a game for more stats!"
        };
        if (document.getElementById("GuessesNum").textContent == ""){
            document.getElementById("GuessesNum").textContent = "Try guessing for more stats!"
            document.getElementById("TotalGuessesNum").textContent = "Try guessing for more stats!"
        };
        if (document.getElementById("WinsNum").textContent == ""){
            document.getElementById("WinsNum").textContent = "Try Getting a number correct for more stats!"
        };
        if (document.getElementById("AverageNum").textContent == ""){
            document.getElementById("AverageNum").textContent = "Just Try playing for more stats!"
        };
        if (document.getElementById("Best").textContent == ""){
            document.getElementById("Best").textContent = "Just Try playing for more stats!"
        };
    }

    function rand(){
        lamba = Math.floor(Math.random(1)*1000000)
    };

    function start(){
        if (!UserName == "") {
            if (!running){
                guesses = 0
                running = 1
                rand();
                document.getElementById("GuessesNum").textContent = "Guesses: 0";
                document.getElementById("DebugNum").textContent = lamba;
                document.getElementById("StartButton").textContent = "Submit Guess!"
                document.getElementById("Status").textContent = "Hmm watcha gonna guess " + UserName + "?!"
                document.getElementById("GuessInput").hidden=false
            }
            else guess()
        } else {
            document.getElementById("Status").textContent = "Username Invalid!!"
        }



    }
    function guess(){
        totalguesses ++
        guesses ++
        guessval = Number(document.getElementById("GuessInput").value);
        document.getElementById("GuessesNum").textContent = "Guesses: "+ guesses;
        document.getElementById("TotalGuessesNum").textContent = "Total Guesses: " + totalguesses;

        if (guessval>lamba){
            document.getElementById("Status").textContent = guessval + " Was Too High"
        };
        if (guessval<lamba){
            document.getElementById("Status").textContent = guessval + " Was Too Low"
        };
        if (guessval==lamba){
            wins ++
            document.getElementById("WinsNum").textContent = "Wins: " + wins;
            document.getElementById("Status").textContent = guessval + " Was Perfect!"
            document.getElementById("StartButton").textContent = "Click to start again!"
            document.getElementById("GuessInput").hidden=true
            document.getElementById("GuessInput").value = ""
            running = 0
            if (best>guesses){
                best = guesses
                document.getElementById("Best").textContent = "Your least guesses was: "+best
                document.getElementById("Status").textContent = guessval + " Thats a new best!"
                Checkdata(UserName, best)
            }
        };

        if (wins != 0){
            document.getElementById("AverageNum").textContent = "Average guesses per win: " + (totalguesses/wins)
        };
    }
        
</script>
