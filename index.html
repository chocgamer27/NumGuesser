<body>

    <button id="Startbutton"; onclick=" start()"; style="position: absolute; width: 15%; height: 15%;"></button>
    <h1 id="DebugNum" style="font-size: xx-large; position: absolute; width: 15%; height: 15%; top: 15%;"></h1>

</body>

<script>
    let num = 0
    
    function start(){

        num = Math.random()*Math.random/(Math.random^(0-Math.random)*(10*Math.random))
        
        Document.getElementById("DebugNum").textContent = num

    }
        
</script>
